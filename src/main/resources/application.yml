spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/racecalendar}
    username: ${DB_USERNAME:racecalendar}
    password: ${DB_PASSWORD:racecalendar}

  flyway:
    enabled: true
    
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

vaadin:
  launch-browser: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  display-zone: Europe/Prague
  sync:
    enabled: true
    interval: PT6H

